<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <title>Shamrock</title>
  <defs>
    <linearGradient id="leafA" x1="0.2" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#aedaba"/>
      <stop offset="1" stop-color="#4ea76c"/>
    </linearGradient>
    <linearGradient id="leafB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ea76c"/>
      <stop offset="1" stop-color="#1f7a43"/>
    </linearGradient>
    <linearGradient id="leafC" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2f8c50"/>
      <stop offset="1" stop-color="#134e2c"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#134e2c"/>
      <stop offset="1" stop-color="#04190e"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#tile)"/>

  <!-- Stem, drawn first so the leaflets sit over its top. -->
  <path d="M512,470 C534,600 540,700 506,806 C498,762 500,690 486,624 C476,576 486,520 512,470 Z"
        fill="#186236"/>

  <!-- Trefoil: one heart leaflet, tip at the origin, rotated 3× about the centre.
       Dark-to-light motif — the top leaf catches the light, lower leaves recede. -->
  <g transform="translate(512,470) scale(1.32)">
    <path d="M0,0 C-96,-72 -150,-150 -96,-208 C-58,-248 -8,-228 0,-168 C8,-228 58,-248 96,-208 C150,-150 96,-72 0,0 Z"
          fill="url(#leafA)"/>
    <path d="M0,0 C-96,-72 -150,-150 -96,-208 C-58,-248 -8,-228 0,-168 C8,-228 58,-248 96,-208 C150,-150 96,-72 0,0 Z"
          fill="url(#leafB)" transform="rotate(120)"/>
    <path d="M0,0 C-96,-72 -150,-150 -96,-208 C-58,-248 -8,-228 0,-168 C8,-228 58,-248 96,-208 C150,-150 96,-72 0,0 Z"
          fill="url(#leafC)" transform="rotate(240)"/>
    <circle r="22" fill="#d6ecdc" opacity="0.85"/>
  </g>
</svg>
