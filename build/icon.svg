<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <title>Shamrock</title>
  <desc>A three-leaf clover whose stem tapers into a chat tail.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FCF8"/><stop offset="1" stop-color="#E2F1E6"/>
    </linearGradient>
    <!-- Local user space: the mark is drawn around the origin, so the gradient
         spans the artwork itself rather than the outer canvas. -->
    <linearGradient id="leaf" x1="-190" y1="-215" x2="180" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5BE293"/>
      <stop offset="0.42" stop-color="#22A863"/>
      <stop offset="1" stop-color="#0A4A2E"/>
    </linearGradient>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#tile)"/>

  <g transform="translate(512,446) scale(1.46)" fill="url(#leaf)">
    <!-- Stem: tapers to a point like a speech-bubble tail. -->
    <path d="M-30,-4 C-24,66 -2,132 52,190 C62,200 48,214 36,204 C-16,160 -46,84 -50,0 Z"/>
    <path d="M0,0 C-88,-62 -138,-134 -92,-188 C-58,-226 -12,-210 0,-156 C12,-210 58,-226 92,-188 C138,-134 88,-62 0,0 Z"/>
    <path d="M0,0 C-88,-62 -138,-134 -92,-188 C-58,-226 -12,-210 0,-156 C12,-210 58,-226 92,-188 C138,-134 88,-62 0,0 Z" transform="rotate(122)"/>
    <path d="M0,0 C-88,-62 -138,-134 -92,-188 C-58,-226 -12,-210 0,-156 C12,-210 58,-226 92,-188 C138,-134 88,-62 0,0 Z" transform="rotate(238)"/>
  </g>
</svg>
